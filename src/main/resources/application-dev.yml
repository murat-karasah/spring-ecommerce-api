spring:
  jpa:
    show-sql: true

  devtools:
    restart:
      enabled: true

logging:
  level:
    com.example.ecommerce: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true
